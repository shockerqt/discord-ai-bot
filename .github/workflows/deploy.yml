name: Deploy Discord AI Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          # Define target directory
          TARGET_DIR="/opt/zavier-sama"

          # Create/Ensure target directory permissions
          if [ ! -d "$TARGET_DIR" ]; then
              echo "Creating target directory..."
              sudo mkdir -p $TARGET_DIR
              sudo chown -R $USER:$USER $TARGET_DIR
          fi
          
          # Force ownership to current runner user
          sudo chown -R $USER:$USER $TARGET_DIR

          echo "Deploying to $TARGET_DIR..."

          # Sync files:
          # We use rsync for efficiency if available, or cp.
          # Exclude .git and node_modules to keep copy clean/fast (npm ci will rebuild)
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='.env' . $TARGET_DIR/

          # Write .env from GitHub Secrets
          {
            echo "APP_ID=${{ secrets.APP_ID }}"
            echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}"
            echo "PUBLIC_KEY=${{ secrets.PUBLIC_KEY }}"
            echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}"
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"
            echo "TENOR_API_KEY=${{ secrets.TENOR_API_KEY }}"
            echo "DEFAULT_DEBUG_MODE=${{ vars.DEFAULT_DEBUG_MODE }}"
            echo "PORT=${{ vars.PORT }}"
          } > $TARGET_DIR/.env

          cd $TARGET_DIR

          echo "Installing dependencies..."
          # Strip lockfile to avoid strictly enforcing Windows x64 optional native dependencies on ARM Linux
          rm -f package-lock.json
          # Install dependencies locally on server (fresh resolution for ARM)
          npm install --omit=dev --no-package-lock

          echo "Registering Slash Commands..."
          npm run register

          echo "Restarting service..."
          # Restart PM2 process
          pm2 restart zavier-sama || pm2 restart app.js || echo "PM2 restart failed, check process name"
