<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi Bot Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-panel: #1a1d24;
            --bg-message-user: #2b313d;
            --bg-message-bot: #232730;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #2e3340;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d10; /* Darker "outer" background */
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1600px;
            height: 100%;
            max-height: 95vh;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .channel-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .channel-item:hover, .channel-item.active {
            background-color: rgba(99, 102, 241, 0.1);
        }
        
        .channel-item.active {
            border-left: 3px solid var(--accent);
        }

        .channel-name {
            font-weight: 500;
            color: #fff;
        }

        .channel-guild {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--bg-dark);
        }

        .top-bar {
            height: 65px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            background-color: var(--bg-panel);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .message-container-wrapper {
            flex: 1;
            overflow-y: auto;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .message-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            padding: 15px;
            border-radius: 10px;
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-start;
            background-color: var(--bg-message-user);
            border-bottom-left-radius: 2px;
        }

        .message.assistant {
            align-self: flex-end;
            background-color: var(--bg-message-bot);
            border-bottom-right-radius: 2px;
            border: 1px solid var(--border);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            align-items: center;
        }

        .author {
            font-weight: 600;
            color: #fff;
        }

        .content {
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .metadata {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .badge.success { color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
        .badge.warning { color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
        
        .status-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .status-PENDING { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-WAITING { background: rgba(99, 102, 241, 0.2); color: var(--accent); }
        .status-PROCESSED { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-GENERATING { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            flex-direction: column;
            gap: 10px;
        }
        
        .empty-state svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path><path d="M15 13v-2"></path><path d="M9 13v-2"></path></svg>
                <h1>Lumi Dashboard</h1>
            </div>
            <div class="channel-list" id="channelList">
                <div class="loader">Loading channels...</div>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar" id="topBar">
                Select a channel to view history
            </div>
            <div class="message-container-wrapper" id="messageWrapper">
                <div class="message-container" id="messageContainer">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <p>No messages selected</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentInterval = null;
        let currentChannelId = null;

        async function fetchChannels() {
            try {
                const res = await fetch('/api/channels');
                const channels = await res.json();
                const container = document.getElementById('channelList');
                
                if (channels.length === 0) {
                    container.innerHTML = '<div style="padding: 15px; color: var(--text-secondary); text-align: center;">No active channels</div>';
                    return;
                }

                container.innerHTML = '';
                channels.forEach(ch => {
                    const el = document.createElement('div');
                    el.className = `channel-item ${ch.id === currentChannelId ? 'active' : ''}`;
                    el.onclick = () => loadChannel(ch.id, ch.name, ch.guild);
                    
                    el.innerHTML = `
                        <div class="channel-name">#${ch.name}</div>
                        <div class="channel-guild">${ch.guild}</div>
                    `;
                    container.appendChild(el);
                });
            } catch (err) {
                console.error('Error fetching channels:', err);
            }
        }

        async function loadChannel(id, name, guild) {
            currentChannelId = id;
            document.getElementById('topBar').textContent = `${guild} > #${name}`;
            
            // Highlight selected
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (currentInterval) clearInterval(currentInterval);
            await fetchMessages(id);
            
            // Auto refresh every 3 seconds
            currentInterval = setInterval(() => fetchMessages(id), 3000);
        }

        async function fetchMessages(id) {
            try {
                const res = await fetch(`/api/channels/${id}/messages`);
                const messages = await res.json();
                renderMessages(messages);
            } catch (err) {
                console.error('Error fetching messages:', err);
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        function renderMessages(messages) {
            const container = document.getElementById('messageContainer');
            const wrapper = document.getElementById('messageWrapper');
            
            // Si estamos cerca del fondo, hacemos auto-scroll después de renderizar
            const isScrolledToBottom = wrapper.scrollHeight - wrapper.clientHeight <= wrapper.scrollTop + 50;

            if (messages.length === 0) {
                if (!container.querySelector('.empty-state')) {
                    container.innerHTML = '<div class="empty-state"><p>No messages in history</p></div>';
                }
                return;
            }

            // Remove empty state if exists
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            // Track current IDs to handle deleted messages (e.g., when /reset is used)
            const currentIds = new Set(messages.map(m => `msg-${m.id}`));
            Array.from(container.children).forEach(child => {
                if (child.id && child.id.startsWith('msg-') && !currentIds.has(child.id)) {
                    child.remove();
                }
            });

            messages.forEach(msg => {
                // Remove invalid characters for an HTML ID
                const safeId = `msg-${msg.id.replace(/[^a-zA-Z0-9-_]/g, '')}`;
                let el = document.getElementById(safeId);
                
                if (!el) {
                    el = document.createElement('div');
                    el.id = safeId;
                    el.className = `message ${msg.role}`;
                    container.appendChild(el);
                }
                
                let metaHtml = '';
                if (msg.metadata) {
                    const m = msg.metadata;
                    if (m.decision) {
                        const style = m.decision === 'RESPONDER' ? 'success' : 'warning';
                        metaHtml += `<span class="badge ${style}">Decision: ${m.decision}</span>`;
                    }
                    if (m.reason) {
                        metaHtml += `<span class="badge" title="${escapeHTML(m.reason)}">Reason: ${escapeHTML(m.reason.length > 30 ? m.reason.substring(0,30)+'...' : m.reason)}</span>`;
                    }
                    if (m.model) {
                        metaHtml += `<span class="badge">Model: ${m.model}</span>`;
                    }
                    if (m.usage) {
                        metaHtml += `<span class="badge">Tokens: ${m.usage.totalTokens}</span>`;
                    }
                }

                const newHTML = `
                    <div class="message-header">
                        <span class="author">${escapeHTML(msg.author)}</span>
                        <div>
                            <span class="status-badge status-${msg.status}">${msg.status}</span>
                            <span style="margin-left: 10px;">${msg.timestamp}</span>
                        </div>
                    </div>
                    <div class="content">${escapeHTML(msg.content)}</div>
                    ${metaHtml ? `<div class="metadata">${metaHtml}</div>` : ''}
                `;

                // Solo actualizar si el contenido ha cambiado para evitar repintados y parpadeos
                if (el.innerHTML !== newHTML.trim()) {
                    el.innerHTML = newHTML.trim();
                }
            });

            if (isScrolledToBottom) {
                wrapper.scrollTop = wrapper.scrollHeight;
            }
        }

        // Init
        fetchChannels();
        setInterval(fetchChannels, 10000); // refresh channel list every 10s
    </script>
</body>
</html>
